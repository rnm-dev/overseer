name: overseer_mobile
description: "Flutter shell bootstrap for Overseer Mobile."
publish_to: 'none'
version: 1.0.1+11

environment:
  sdk: ^3.12.2
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  go_router: ^17.3.0
  dio: ^5.10.0
  web_socket_channel: ^3.0.3
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.3
  audioplayers: ^6.8.1
  audio_session: ^0.2.4
  flutter_web_auth_2: ^5.0.3
  desktop_webview_window: ^0.3.0
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  lucide_icons_flutter: ^3.1.15
  file_picker: ^11.0.2
  pasteboard: ^0.5.0
  crypto: ^3.0.7
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.12
  flutter_mermaid: ^0.1.0
  markdown: ^7.3.1
  pdfrx: ^2.4.7
  webview_flutter: ^4.14.1
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  record: ^7.1.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_native_splash: ^2.4.8
  image: ^4.8.0

dependency_overrides:
  desktop_webview_window:
    path: third_party/desktop_webview_window

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/overseer-splash.png
    - assets/sounds/peon/
    - assets/sounds/sc_scv/
    - assets/sounds/peasant/
    - assets/fonts/golos_text/OFL.txt
  fonts:
    - family: Golos Text
      fonts:
        - asset: assets/fonts/golos_text/GolosText-Regular.ttf
          weight: 400
        - asset: assets/fonts/golos_text/GolosText-Medium.ttf
          weight: 500
        - asset: assets/fonts/golos_text/GolosText-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/golos_text/GolosText-Bold.ttf
          weight: 700
