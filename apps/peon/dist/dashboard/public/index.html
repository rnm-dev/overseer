<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Peon</title>
<meta name="description" content="Peon is an autonomous coding agent daemon that watches, codes, verifies, and moves work forward." />
<!-- Real sub-paths (e.g. /sessions/abc123) serve this same file — script
     src="lib/..." etc. below would otherwise resolve relative to that
     sub-path instead of the site root. -->
<base href="/" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
  rel="stylesheet"
/>
<script src="https://cdn.tailwindcss.com?plugins=typography"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        fontFamily: {
          mono: ['"JetBrains Mono"', "ui-monospace", "SFMono-Regular", "Menlo", "monospace"],
        },
        colors: {
          // Deliberately monochrome: hierarchy comes from contrast, not color.
          slate: {
            50: "#fafafa",
            100: "#f4f4f5",
            200: "#e4e4e7",
            300: "#d4d4d8",
            400: "#a1a1aa",
            500: "#71717a",
            600: "#52525b",
            700: "#303034",
            800: "#202023",
            900: "#111113",
            950: "#080809",
          },
          brand: {
            300: "#f4f4f5",
            400: "#e4e4e7",
            500: "#d4d4d8",
            600: "#52525b",
            700: "#3f3f46",
            900: "#18181b",
            950: "#09090b",
          },
        },
      },
    },
  };
</script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  html { font-size: 13px; }
  body {
    font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    background: #080809;
    letter-spacing: -0.01em;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .cursor-blink { animation: blink 1s step-end infinite; }
</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 antialiased">
  <div id="root"></div>

  <!-- Shared namespace: every module attaches its exports here (no build step, -->
  <!-- so real ES modules aren't available across plain <script> tags — this is -->
  <!-- the lightweight stand-in). Load order below matters: dependencies first. -->
  <script>window.ACA = {};</script>

  <script src="lib/api.js"></script>
  <script src="lib/format.js"></script>
  <script src="lib/hooks.js"></script>
  <script src="lib/transcript.js"></script>

  <script type="text/babel" data-presets="react" src="components/primitives.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/Landing.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/AttachmentPicker.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/DashboardGate.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/UpdateBanner.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/Sidebar.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/ActiveUsersCard.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/PeonOverviewCard.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/ProjectsCard.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/RecentSessionsCard.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/SessionTranscript.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/SessionFilePreview.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/SessionList.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/SessionDetail.jsx"></script>

  <script type="text/babel" data-presets="react" src="components/SessionsCard.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/AICard.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/SettingsCard.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/ArmoryCard.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/SettingsView.jsx"></script>
  <script type="text/babel" data-presets="react" src="components/OverseerCard.jsx"></script>
  <script type="text/babel" data-presets="react" src="app.jsx"></script>
</body>
</html>
