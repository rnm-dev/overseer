# Overseer production deployment on nid-01.
# Cloudflare and host nginx terminate public TLS. This checked-in target
# publishes the shared kamal-proxy on loopback-only 8080/8443 so nginx can
# reach it but the Internet cannot bypass nginx. Production remains wildcard
# host-bound on both ports until an explicitly approved proxy reboot applies
# this run state; only 8080 was independently verified Internet-reachable. An
# ordinary app deploy does not authorize that shared-host mutation.
service: overseer
image: rnmdev/overseer
minimum_version: 2.12.0

servers:
  web:
    - 94.247.128.103

# Intentionally no host/hosts: tokenized preview subdomains are dynamic. This
# makes Overseer the fallback only inside kamal-proxy; production host validation
# and the nginx allowlist reject unrelated hostnames.
proxy:
  ssl: false
  app_port: 5000
  forward_headers: true
  # Shared proxy boot state. Version/bind are pinned so a future approved
  # `kamal proxy reboot` cannot silently restore public 0.0.0.0 listeners.
  run:
    repository: basecamp/kamal-proxy
    version: v0.9.2
    http_port: 8080
    https_port: 8443
    publish: true
    bind_ips:
      - 127.0.0.1
  response_timeout: 3600
  healthcheck:
    path: /healthz
    interval: 3
    timeout: 3
  buffering:
    requests: false
    responses: false

registry:
  username: vibze
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # The repository root: npm workspaces keep one lockfile there, so the build
  # context has to reach above this app. Deploy from apps/server as before.
  context: ../..

env:
  clear:
    NODE_ENV: production
    OVERSEER_HOST: 0.0.0.0
    OVERSEER_PORT: 5000
    # Peons are told to phone home here too: OVERSEER_PEON_CALLBACK_URL
    # defaults to this and is only set when peons arrive over a different name
    # than the browser does.
    OVERSEER_PUBLIC_URL: https://overseer.rnm.dev
    # Only controlled nginx/Kamal/Docker peers may supply X-Forwarded-For.
    # Public client addresses remain untrusted and stop the right-to-left walk.
    OVERSEER_TRUSTED_PROXIES: loopback,linklocal,uniquelocal
    # Email + password sign-in beside GitHub. Stated explicitly rather than left
    # to the default: opening local accounts on the production origin is a
    # decision, not something a config file should do quietly.
    OVERSEER_PASSWORD_AUTH: 1
    # Explicitly enables the read-only fictional workspace used by App Review.
    # The helper also requires production and the exact public origin.
    OVERSEER_APP_REVIEW_DEMO: 1
    OVERSEER_PREVIEW_TOKEN_TTL_MS: 600000
    OVERSEER_RECONCILE_INTERVAL_MS: 30000
    # Voice dictation. The preset resolves to Groq's OpenAI-compatible endpoint
    # and its model pair; only the key is a secret. The daily ceiling matters
    # because the per-user limits are per user: 20 requests/minute is 1200 an
    # hour for one person, against a provider tier granting 1000 a day.
    #
    # 800 rather than the full 1000 because dev holds the SAME key and keeps its
    # own ledger — the two instances cannot see each other's spend, so the split
    # (800 here, 200 on dev) is what keeps the sum inside the tier. Raise this to
    # 1000 if dev is given its own key, or to the paid tier's limit on upgrade.
    OVERSEER_VOICE: groq
    OVERSEER_VOICE_REQUESTS_PER_DAY: 800
  secret:
    - DATABASE_URL
    - OVERSEER_GITHUB_CLIENT_ID
    - OVERSEER_GITHUB_CLIENT_SECRET
    - OVERSEER_VOICE_API_KEY
    # Firebase service account for FCM HTTP v1 (project overseer-9fe46), passed
    # as base64 of the JSON. Production and dev hold DIFFERENT Firebase projects
    # — a device token is only valid in the project that minted it — so unlike
    # the voice key there is no shared budget to split here.
    - OVERSEER_PUSH_FCM_CREDENTIALS


accessories:
  postgres:
    service: overseer-postgres
    image: postgres:16-alpine
    host: 94.247.128.103
    env:
      clear:
        POSTGRES_USER: overseer
        POSTGRES_DB: overseer
      secret:
        - POSTGRES_PASSWORD
    volumes:
      - overseer-postgres-data:/var/lib/postgresql/data
      - overseer-postgres-backups:/backups
    options:
      health-cmd: "pg_isready -U overseer -d overseer"
      health-interval: 5s
      health-timeout: 5s
      health-retries: 12

aliases:
  logs: app logs -f
  shell: app exec --interactive --reuse "sh"
  dbconsole: accessory exec postgres --interactive "psql -U overseer -d overseer"
