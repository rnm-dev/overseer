# overseer.rnm.dev — full-stack: React dashboard (Vite dev, HMR) + JSON API.
# TLS terminated upstream (Cloudflare); nginx listens :80.
#   /api, /agent    → API container      (127.0.0.1:4580)
#   everything else → Vite dev server     (127.0.0.1:4581)  incl. HMR websocket
# The mobile app talks to /api directly. WebSocket/SSE upgrade via the global
# $connection_upgrade map (conf.d/00-connection-upgrade.conf).

# Trust CF-Connecting-IP only when the TCP peer is in Cloudflare's published
# network list (verified 2026-07-30 against cloudflare.com/ips-v4 and ips-v6).
# Direct-origin peers cannot change $remote_addr with a spoofed CF header.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# Opaque-token HTML previews. Every path on these hosts goes to Express: it
# validates the token/root and fetches the asset from Peon. Never send a preview
# host to Vite, where it could inherit the operator application's behavior.
server {
    listen 80;
    listen [::]:80;
    server_name *.preview.overseer.rnm.dev;
    client_max_body_size 100M;

    location / {
        proxy_pass         http://100.64.0.5:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name overseer.rnm.dev;
    client_max_body_size 520M;

    location / {
        proxy_pass         http://100.64.0.5:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name overseer-dev.rnm.dev;
    client_max_body_size 100M;

    # --- JSON API (operator + mobile) and peon-facing endpoints ---
    location /api {
        proxy_pass         http://127.0.0.1:4580;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    location /agent {
        proxy_pass         http://127.0.0.1:4580;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 24h;
    }

    # Authenticated browser file viewer. Keep this out of the Vite SPA fallback.
    location /view {
        proxy_pass         http://127.0.0.1:4580;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # --- React dashboard (Vite dev server + HMR websocket) ---
    location / {
        proxy_pass         http://127.0.0.1:4581;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 24h;
    }
}
