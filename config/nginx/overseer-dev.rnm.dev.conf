# overseer.rnm.dev — full-stack: React dashboard (Vite dev, HMR) + JSON API.
# TLS terminated upstream (Cloudflare); nginx listens :80.
#   /api, /agent    → API container      (127.0.0.1:4580)
#   everything else → Vite dev server     (127.0.0.1:4581)  incl. HMR websocket
# The mobile app talks to /api directly. WebSocket/SSE upgrade via the global
# $connection_upgrade map (conf.d/00-connection-upgrade.conf).

# Opaque-token HTML previews. Every path on these hosts goes to Express: it
# validates the token/root and fetches the asset from Peon. Never send a preview
# host to Vite, where it could inherit the operator application's behavior.
server {
    listen 80;
    listen [::]:80;
    server_name *.preview.overseer.rnm.dev;
    client_max_body_size 100M;

    location / {
        proxy_pass         http://100.64.0.5:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name overseer.rnm.dev;
    client_max_body_size 520M;

    location / {
        proxy_pass         http://100.64.0.5:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name overseer-dev.rnm.dev;
    client_max_body_size 100M;

    # --- JSON API (operator + mobile) and peon-facing endpoints ---
    location /api {
        proxy_pass         http://127.0.0.1:4580;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        chunked_transfer_encoding off;
    }

    location /agent {
        proxy_pass         http://127.0.0.1:4580;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_buffering    off;
        proxy_read_timeout 24h;
    }

    # --- React dashboard (Vite dev server + HMR websocket) ---
    location / {
        proxy_pass         http://127.0.0.1:4581;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 24h;
    }
}
