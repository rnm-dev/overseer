# Prepared only: do not enable this file until the approved DNS/origin cutover.
# Cloudflare terminates TLS; nginx forwards both the operator origin and dynamic
# isolated preview origins to the shared kamal-proxy HTTP listener.
server {
    listen 80;
    listen [::]:80;
    server_name overseer.rnm.dev *.preview.overseer.rnm.dev;

    client_max_body_size 520M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
