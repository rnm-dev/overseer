# Overseer — a complete self-hosted install.
#
# Copy this file, edit the marked values in place, and run it. Every setting
# lives here: there is no .env to keep in sync, and nothing is interpolated from
# the surrounding shell, so what this file says is what the containers get.
#
#   docker compose up -d
#   docker compose logs -f app
#
# Your edited copy holds a database password and OAuth secrets. Keep it mode
# 600 and out of version control.
#
# Overseer speaks plain HTTP on 5000 and is published on loopback only. Put a
# reverse proxy with TLS in front of it — the origin below must be the address
# that proxy serves, or sign-in callbacks and host validation will not match.
#
# The reference for every value, including the ones deliberately left out of
# this file, is docs/configuration.md.

# Pinned so the data volume reattaches no matter what the directory is called.
name: overseer

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: overseer
      # EDIT — and use the same password in DATABASE_URL below.
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: overseer
    volumes:
      # The database. Nothing else in this stack holds state, and losing this
      # volume loses the installation.
      - overseer-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U overseer"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # `latest` is the current release, which is what most installations want.
    # Know what it costs: schema migrations run on boot and are one-way, so a
    # `docker compose pull` picks up an upgrade you did not separately decide
    # to take. Replace it with an exact version — rnmdev/overseer:0.5.0 — to
    # make upgrading deliberate. What a version number promises is in
    # docs/releasing.md, and the releases are at ovrseer.org/changelog/.
    image: rnmdev/overseer:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Loopback only. Your reverse proxy connects here; the Internet must not.
      - "127.0.0.1:5000:5000"
    environment:
      # ── Required ────────────────────────────────────────────────────────
      # EDIT — the password must match POSTGRES_PASSWORD above.
      DATABASE_URL: postgresql://overseer:change-me@postgres:5432/overseer
      # EDIT — this instance's public origin, exactly as a browser reaches it.
      # Sign-in callbacks, peon enrollment and host validation all derive from
      # it, and the app refuses to start in production without it.
      OVERSEER_PUBLIC_URL: https://overseer.example.com

      # ── Sign in — at least one, or nobody can log in ─────────────────────
      # Email + password.
      OVERSEER_PASSWORD_AUTH: "1"
      # Registration without an invitation. This is how you make the FIRST
      # account: bring the instance up with it set, register at your public URL —
      # you get a workspace of your own — then comment it out and restart, and
      # the instance is invite-only again. Leave it on only if you mean anyone
      # who can reach this instance to be able to register. Either way, joining
      # an existing workspace still needs an invite. OIDC ignores this: a
      # configured single-tenant issuer is itself the invitation.
      OVERSEER_OPEN_SIGNUP: "1"
      # GitHub OAuth. Register <public-url>/auth/github/callback with the app.
      #OVERSEER_GITHUB_CLIENT_ID: ""
      #OVERSEER_GITHUB_CLIENT_SECRET: ""
      # OpenID Connect. https issuer only; its endpoints are discovered.
      #OVERSEER_OIDC_ISSUER: https://id.example.com
      #OVERSEER_OIDC_CLIENT_ID: ""
      #OVERSEER_OIDC_CLIENT_SECRET: ""
      #OVERSEER_OIDC_LABEL: ""

      # ── Network ─────────────────────────────────────────────────────────
      # Peons are told to phone home at OVERSEER_PUBLIC_URL. Set this only if
      # they reach the instance by a different name — a tailnet address, say.
      #OVERSEER_PEON_CALLBACK_URL: ""

      # ── Optional ────────────────────────────────────────────────────────
      # Voice dictation. Without a provider, clients simply hide the
      # microphone. Set the daily ceiling to your provider tier's limit —
      # without it, one busy person can spend the whole quota.
      #OVERSEER_VOICE: groq
      #OVERSEER_VOICE_API_KEY: ""
      #OVERSEER_VOICE_REQUESTS_PER_DAY: "1000"
      # Push to mobile clients. Expo delivery needs no credential; this adds
      # the direct FCM path, as base64 of a Firebase service account.
      #OVERSEER_PUSH_FCM_CREDENTIALS: ""

volumes:
  overseer-postgres-data:
